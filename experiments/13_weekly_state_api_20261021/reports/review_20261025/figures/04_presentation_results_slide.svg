  <g id="text_19">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #21324c" x="86.4" y="470.448" transform="rotate(-0 86.4 470.448)">All differences = strong − no pressure. H1: lower follows prediction; H2: higher follows prediction.</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2455d3" x="86.4" y="512.568" transform="rotate(-0 86.4 512.568)">Two models had identical outcomes across the pressure conditions.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58677b" x="86.4" y="550.8" transform="rotate(-0 86.4 550.8)">No enforced time restriction; chains generated jointly. H3/H4 education contrasts were not collected.</text>
  </g>
