   <text style="font: 700 21px 'DejaVu Sans'; text-anchor: start" x="55.44" y="27.476719" transform="rotate(-0, 55.44, 27.476719)">Statistical evidence across the fixed sample prefixes</text>
  </g>
  <g id="text_20">
   <text style="fill: #455665; font: 11px 'DejaVu Sans'; text-anchor: start" x="55.44" y="43.2" transform="rotate(-0, 55.44, 43.2)">The five adjusted p-value curves coincide in these data; one line represents H1, H2, H3, H4a and H4b.</text>
  </g>
  <g id="text_21">
   <text style="font: 11px 'DejaVu Sans'" transform="translate(55.44 486.438281)">Calculation: exact paired sign-flip test for each outcome, followed by Holm correction across five tests at each prefix.</text>
   <text style="font: 11px 'DejaVu Sans'" transform="translate(55.44 501.263359)">Each outcome has all block differences in its predicted direction, so the p-value curves are identical.</text>
   <text style="font: 11px 'DejaVu Sans'" transform="translate(55.44 516.088438)">n = 1: p unavailable. n = 10: fixed primary analysis. Earlier crossings are descriptive and were not a stopping rule.</text>
  </g>
 </g>
