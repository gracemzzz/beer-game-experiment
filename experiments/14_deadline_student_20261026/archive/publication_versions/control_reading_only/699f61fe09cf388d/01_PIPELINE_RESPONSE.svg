  <g id="text_13">
   <text style="font: 700 22px 'DejaVu Sans'; text-anchor: start" x="47.52" y="28.236562" transform="rotate(-0, 47.52, 28.236562)">120 seconds vs 8 seconds: control reading</text>
  </g>
  <g id="text_14">
   <text style="fill: #455665; font: 11px 'DejaVu Sans'; text-anchor: start" x="47.52" y="43.2" transform="rotate(-0, 47.52, 43.2)">Measured condition values · 10 matched chain pairs · 4 roles per chain · 24 game weeks</text>
  </g>
  <g id="text_15">
   <text style="font: 10px 'DejaVu Sans'" transform="translate(47.52 508.718437)">Calculation: Within each chain, average the 8 matched probe slopes: (order with low outstanding replenishment − order with high outstanding</text>
   <text style="font: 10px 'DejaVu Sans'" transform="translate(47.52 521.435938)">replenishment) / increase in outstanding cases. Then average 10 chains.</text>
  </g>
  <g id="text_16">
   <text style="fill: #455665; font: 10px 'DejaVu Sans'; text-anchor: start" x="47.52" y="561.6" transform="rotate(-0, 47.52, 561.6)">Fictional student time framing; actual model runtime was unrestricted. Values are observed levels, not differences.</text>
  </g>
