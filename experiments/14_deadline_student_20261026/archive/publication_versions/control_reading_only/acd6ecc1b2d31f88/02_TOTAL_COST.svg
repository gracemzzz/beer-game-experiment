  <g id="text_19">
   <text style="fill: #455665; font: 20px 'DejaVu Sans'; text-anchor: start" x="63.36" y="55.08" transform="rotate(-0, 63.36, 55.08)">10 chains per condition · 4 roles per chain · 24 game weeks</text>
  </g>
  <g id="text_20">
   <text style="font: 18px 'DejaVu Sans'" transform="translate(63.36 551.517187)">Calculation: Sum (0.5 × remaining inventory + 1 × unfilled demand) across all 4 roles and 24 weeks for</text>
   <text style="font: 18px 'DejaVu Sans'" transform="translate(63.36 573.040969)">each chain. Then average 10 chain totals.</text>
  </g>
  <g id="text_21">
   <text style="fill: #455665; font: 15px 'DejaVu Sans'; text-anchor: start" x="63.36" y="622.08" transform="rotate(-0, 63.36, 622.08)">Numbers: mean ± 95% CI margin (t, n=10). P-values use paired comparisons; CI bands describe each mean.</text>
  </g>
  <g id="text_22">
   <text style="fill: #455665; font: 15px 'DejaVu Sans'; text-anchor: start" x="63.36" y="640.224" transform="rotate(-0, 63.36, 640.224)">Fictional time framing; actual model runtime was unrestricted.</text>
  </g>
