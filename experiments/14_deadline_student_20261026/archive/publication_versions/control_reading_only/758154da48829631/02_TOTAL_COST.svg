   <text style="fill: #455665; font: 16px 'DejaVu Sans'; text-anchor: start" x="63.36" y="631.8" transform="rotate(-0, 63.36, 631.8)">Fictional time framing; actual model runtime was unrestricted. Dots show measured levels.</text>
