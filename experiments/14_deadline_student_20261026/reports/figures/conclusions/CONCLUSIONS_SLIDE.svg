   </g>
   <g id="text_27">
    <text style="fill: #173247; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="606.96" y="491.116875" transform="rotate(-0, 606.96, 491.116875)">H4b  Bullwhip decreased</text>
   </g>
