   </g>
   <g id="text_34">
    <text style="fill: #526575; font: 16px 'DejaVu Sans'; text-anchor: start" x="39.6" y="588.8775" transform="rotate(-0, 39.6, 588.8775)">Means across 10 chains per condition. Percent change = (second − first) / first × 100.</text>
   </g>
   <g id="text_35">
    <text style="fill: #173247; font: 17px 'DejaVu Sans'; text-anchor: start" x="39.6" y="615.557344" transform="rotate(-0, 39.6, 615.557344)">Fictional 8/120-second framing; actual model runtime unrestricted. No human participants.</text>
