   <g id="text_1">
    <text style="fill: #526575; font: 700 16px 'DejaVu Sans'; text-anchor: start" x="39.6" y="36.6375" transform="rotate(-0, 39.6, 36.6375)">EXPERIMENT 14  ·  LLM BEER GAME</text>
   </g>
   <g id="text_2">
    <text style="fill: #173247; font: 700 34px 'DejaVu Sans'; text-anchor: start" x="39.6" y="81.274687" transform="rotate(-0, 39.6, 81.274687)">Short-time framing: higher costs</text>
   </g>
   <g id="text_3">
    <text style="fill: #173247; font: 700 28px 'DejaVu Sans'; text-anchor: start" x="39.6" y="117.035625" transform="rotate(-0, 39.6, 117.035625)">Education: stronger pipeline response, steadier orders</text>
   </g>
   <g id="text_4">
    <text style="fill: #526575; font: 18px 'DejaVu Sans'; text-anchor: start" x="39.6" y="148.317187" transform="rotate(-0, 39.6, 148.317187)">10 matched blocks · 10 chains per condition · 4 roles per chain · 24 weeks</text>
   </g>
   <g id="text_5">
    <text style="fill: #a85522; font: 700 22px 'DejaVu Sans'; text-anchor: start" x="39.6" y="185.916562" transform="rotate(-0, 39.6, 185.916562)">TIME FRAMING</text>
   </g>
   <g id="text_6">
    <text style="fill: #173247; font: 700 22px 'DejaVu Sans'; text-anchor: start" x="39.6" y="214.716563" transform="rotate(-0, 39.6, 214.716563)">120 seconds → 8 seconds</text>
   </g>
   <g id="text_7">
    <text style="fill: #526575; font: 18px 'DejaVu Sans'; text-anchor: start" x="39.6" y="239.037188" transform="rotate(-0, 39.6, 239.037188)">Same control reading</text>
   </g>
   <g id="text_8">
    <text style="fill: #147b71; font: 700 22px 'DejaVu Sans'; text-anchor: start" x="590.4" y="185.916562" transform="rotate(-0, 590.4, 185.916562)">EDUCATION</text>
   </g>
   <g id="text_9">
    <text style="fill: #173247; font: 700 22px 'DejaVu Sans'; text-anchor: start" x="590.4" y="214.716563" transform="rotate(-0, 590.4, 214.716563)">Control reading → causal education</text>
   </g>
   <g id="text_10">
    <text style="fill: #526575; font: 18px 'DejaVu Sans'; text-anchor: start" x="590.4" y="239.037188" transform="rotate(-0, 590.4, 239.037188)">8 seconds in both conditions</text>
   </g>
   <g id="text_11">
